[workspace]
resolver = "3"
members = ["crates/core", "crates/app"]

[workspace.package]
version = "0.3.0"
edition = "2024"
license = "GPL-3.0-or-later"
rust-version = "1.92"

[workspace.dependencies]
e-invoice-viewer-core = { path = "crates/core" }
thiserror = "2.0"
lopdf = { version = "0.47", default-features = false }
roxmltree = "0.21"
libxml = "0.3.24"
base64 = "0.22"
gettext = "0.4"
anyhow = "1.0"
gtk = { version = "0.11", package = "gtk4", features = ["v4_12"] }
adw = { version = "0.9", package = "libadwaita", features = ["v1_5"] }
poppler = { version = "0.26", package = "poppler-rs", features = ["v0_82"] }
sourceview = { version = "0.11", package = "sourceview5" }
xee-xpath = "=0.1.5"
xot = "=0.31.2"

# Dependencies are optimised in dev builds too: the XPath engine is too slow
# unoptimised for the validation regression test (spec 0009).
[profile.dev.package."*"]
opt-level = 2

[workspace.lints.rust]
# `deny`, not `forbid`: the libxml2 module of crates/core allows it (ADR 0006).
unsafe_code = "deny"
