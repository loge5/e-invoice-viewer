# Builds the AppImage (spec 0020) and the Windows ZIP and installer (spec 0022).
# Started by hand, it keeps the files as workflow artefacts; for a pushed tag
# v<version> it also creates one draft release with all of them, which the
# author publishes. A release is all or nothing: both platforms must build.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  appimage:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check the tag against Cargo.toml
        if: startsWith(github.ref, 'refs/tags/')
        run: scripts/appimage/check-tag.sh "$GITHUB_REF_NAME"
      - name: Build the AppImage
        run: scripts/appimage.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: appimage
          path: |
            target/appimage/*.AppImage
            target/appimage/bundled-packages.txt
          if-no-files-found: error

  windows:
    runs-on: windows-2025
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: Keep line endings as in the repository
        shell: pwsh
        run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # MSYS2, UCRT64 environment, with the libraries, tools and Rust
      # (ADR 0005).
      - uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2.33.0
        with:
          msystem: UCRT64
          update: true
          pacboy: >-
            gcc:p pkgconf:p rust:p
            gtk4:p libadwaita:p poppler:p gtksourceview5:p
            librsvg:p adwaita-icon-theme:p gettext-tools:p ntldd:p
          install: zip
      - name: Check the tag against Cargo.toml
        if: startsWith(github.ref, 'refs/tags/')
        run: scripts/appimage/check-tag.sh "$GITHUB_REF_NAME"
      - name: Run the tests
        run: |
          rustc --version
          scripts/ci-step.sh Tests cargo test --workspace --locked --no-fail-fast
      - name: Build and bundle
        run: |
          scripts/ci-step.sh Build cargo build --release --locked -p e-invoice-viewer
          scripts/ci-step.sh Bundle scripts/windows/bundle.sh
      - name: Build the installer
        shell: pwsh
        run: |
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "(.*)"$').Matches[0].Groups[1].Value
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup --version=6.4.3 --no-progress -y
          }
          $output = & $iscc "/DVersion=$version" scripts\windows\installer.iss 2>&1
          $output | Write-Output
          if ($LASTEXITCODE -ne 0) {
            $tail = ($output | Select-Object -Last 40) -join '%0A'
            Write-Output "::error title=Installer::$tail"
            exit $LASTEXITCODE
          }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows
          path: |
            target/windows/*.zip
            target/windows/*-setup.exe
            target/windows/bundled-packages-windows.txt
          if-no-files-found: error

  release:
    needs: [appimage, windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: Create a draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$GITHUB_REF_NAME" --draft --verify-tag \
            --title "E-Invoice Viewer ${GITHUB_REF_NAME#v}" \
            dist/*.AppImage dist/bundled-packages.txt \
            dist/*-windows-x86_64.zip dist/*-windows-x86_64-setup.exe \
            dist/bundled-packages-windows.txt
