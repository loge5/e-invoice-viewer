# Checks every push and pull request on Linux and Windows (spec 0026).
# A failing step reports its last output lines as an annotation, readable
# without signing in (scripts/ci-step.sh).
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the build dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends \
            gettext libgtk-4-dev libadwaita-1-dev libpoppler-glib-dev \
            libgtksourceview-5-dev libxml2-dev libclang-dev desktop-file-utils appstream
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: linux-cargo-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: linux-cargo-
      - name: Format
        run: scripts/ci-step.sh Format cargo fmt --all --check
      - name: Clippy
        run: scripts/ci-step.sh Clippy cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Tests
        run: scripts/ci-step.sh Tests cargo test --workspace --locked --no-fail-fast
      - name: Architecture check
        run: |
          # crates/core must not depend on GUI libraries.
          if cargo tree -p e-invoice-viewer-core -e normal --locked | grep -E "gtk|glib|poppler|adw"; then
            echo "::error title=Architecture::crates/core depends on a GUI library"
            exit 1
          fi

  windows:
    runs-on: windows-2025
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: Keep line endings as in the repository
        shell: pwsh
        run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2.33.0
        with:
          msystem: UCRT64
          update: true
          pacboy: >-
            gcc:p pkgconf:p rust:p clang:p libxml2:p
            gtk4:p libadwaita:p poppler:p gtksourceview5:p
            librsvg:p adwaita-icon-theme:p gettext-tools:p ntldd:p
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target
          key: windows-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: windows-cargo-
      - name: Tests
        run: scripts/ci-step.sh Tests cargo test --workspace --locked --no-fail-fast
